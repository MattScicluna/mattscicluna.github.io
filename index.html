<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Private preview</title>
<style>
:root { --paper:#ffffff; --ink:#1c1c1c; --faint:#757570; --line:#e1e1da; --marker:#91062f; --swish:#88ac0b; }
@media (prefers-color-scheme: dark) {
  :root { --paper:#17160f; --ink:#eae6da; --faint:#8b877a; --line:#363428; --marker:#e05677; --swish:#a3c92f; }
}
* { box-sizing: border-box; }
body {
  margin:0; min-height:100vh; display:grid; place-items:center;
  background:var(--paper); color:var(--ink);
  font-family: system-ui, sans-serif;
}
.card { width:min(22rem, 90vw); padding:2rem 1.8rem; border:1px solid var(--line); border-radius:6px; }
.rule { height:4px; background:linear-gradient(to right, var(--swish), transparent 75%); margin-bottom:1.4rem; }
h1 { font-size:1.05rem; margin:0 0 0.3rem; }
p { font-size:0.85rem; color:var(--faint); margin:0 0 1.2rem; }
input {
  width:100%; padding:0.6rem 0.7rem; font-size:1rem; margin-bottom:0.8rem;
  border:1px solid var(--line); border-radius:4px; background:transparent; color:var(--ink);
}
input:focus-visible, button:focus-visible { outline:2px solid var(--swish); outline-offset:2px; }
button {
  width:100%; padding:0.6rem; font-size:0.95rem; font-weight:600; cursor:pointer;
  background:var(--marker); color:#fff; border:none; border-radius:4px;
}
.err { color:var(--marker); font-size:0.82rem; min-height:1.2em; margin-top:0.7rem; }
</style>
</head>
<body>
<form class="card" id="f">
  <div class="rule"></div>
  <h1>Private preview</h1>
  <p>This page is encrypted. Enter the passphrase to view it.</p>
  <input type="password" id="pw" autocomplete="current-password" aria-label="Passphrase" autofocus>
  <button type="submit">Unlock</button>
  <div class="err" id="err" role="alert"></div>
</form>

async function unlock(pw) {
